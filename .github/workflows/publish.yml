# Publish to npm when a version tag is pushed, using npm Trusted Publishing.
#
# GitHub Actions mints a short-lived credential over OIDC, so there is no npm
# password, NPM_TOKEN, or NODE_AUTH_TOKEN anywhere. The trust is configured once
# on the npm side and names this repository, this workflow FILENAME, and the
# environment below — so keep those three stable, or npm stops recognizing the
# run. See docs/publishing.md for the one-time setup.
#
# The tag is the confirmation gesture; nothing publishes on a merge. The two
# jobs are deliberate: the first tests and packs, the second publishes THAT
# tarball. Publishing the artifact that was tested removes the window where a
# second build could differ from the one the tests passed against, and
# publishing a tarball runs no lifecycle scripts at all.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    name: Validate, test and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tarball: ${{ steps.meta.outputs.tarball }}
      dist-tag: ${{ steps.meta.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the main-ancestry check needs history

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # OIDC needs npm >= 11.5.1
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Read and check the release metadata
        id: meta
        run: |
          tag="${GITHUB_REF_NAME#v}"
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          lock="$(node -p "require('./package-lock.json').version")"

          # npm version writes the manifest, commits, and tags in one step, so
          # these agree unless something was hand-edited. Catch that here rather
          # than publishing a version nobody meant.
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json version $version"
            exit 1
          fi
          if [ "$lock" != "$version" ]; then
            echo "::error::package-lock.json is at $lock, not $version — run npm install and commit it"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of main — merge the release commit first"
            exit 1
          fi
          # An already-published version cannot be overwritten, so fail now
          # instead of halfway through the publish job.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published"
            exit 1
          fi

          # A prerelease must not take `latest` from the stable line.
          case "$version" in
            *-*) tag_name=next ;;
            *)   tag_name=latest ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tarball=${name//\//-}-$version.tgz" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$tag_name" >> "$GITHUB_OUTPUT"
          {
            echo "### $name@$version"
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- dist-tag: \`$tag_name\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - run: npm ci
      - run: npm run release:check
      - run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ steps.meta.outputs.tarball }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    # npm's trusted publisher configuration names this environment. Adding
    # required reviewers to it in repository settings turns the release into a
    # two-key operation; leaving it unprotected keeps the tag as the only
    # gesture. Either way the name must match what npm has on file.
    environment: npm
    permissions:
      contents: read
      id-token: write   # this is what mints the OIDC credential
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: npm-package

      # No NODE_AUTH_TOKEN: npm exchanges the OIDC token for a short-lived
      # publish credential. Provenance comes from the same CI identity.
      - name: Publish the tested tarball
        run: >
          npm publish "${{ needs.validate.outputs.tarball }}"
          --provenance --access public --tag "${{ needs.validate.outputs.dist-tag }}"
